# Reverse proxy in front of the Search Service replicas (audit RF 8: one versus two replicas behind
# nginx, same k6 profile). nginx publishes the Search API on port 7003, so clients, k6 and
# scripts/api_validation.sh keep using http://localhost:7003 whatever the number of replicas.
#
# docker compose mounts this file over /etc/nginx/nginx.conf of the official nginx image, which
# starts it with "daemon off;". Every path below is absolute and the file includes nothing, so the
# same file runs unchanged in any nginx 1.27.3 or newer (the first open-source release whose
# upstream servers accept "resolve").

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS answers the compose service name "search" with the address of every
    # running replica. Re-resolving it every 5 s lets `docker compose up -d --scale search=N` add or
    # remove replicas while nginx keeps running.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream search_replicas {
        zone search_replicas 64k;
        # Search costs vary a lot with the posting-list length of the query, so each request goes
        # to the replica with the fewest requests in flight instead of strict rotation.
        least_conn;
        server search:7003 resolve max_fails=3 fail_timeout=10s;
        # Reused connections to the replicas, so the proxy does not add a TCP handshake per request.
        keepalive 64;
    }

    # One line per request, naming the replica that served it: counting upstream= values in
    # `docker compose logs nginx` shows how the load was split.
    log_format replicas '$time_iso8601 "$request" $status $body_bytes_sent '
                        'upstream=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout replicas buffer=64k flush=1s;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server_tokens off;

    server {
        listen 7003;

        location / {
            proxy_pass http://search_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            # Longer than the replicas' own 15 s write timeout, so a slow search fails at the
            # replica, which logs it, instead of at the proxy.
            proxy_read_timeout 20s;
            # Only a replica that cannot be reached (stopped, restarting) sends the request to
            # another one; slow answers are not retried, which would double the load under stress.
            proxy_next_upstream error;
            proxy_next_upstream_tries 2;
            # Replica that answered (its container address), for curl -i and the experiment.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
