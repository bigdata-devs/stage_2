basePath: /
definitions:
  api.BookListResponse:
    properties:
      books:
        description: IDs of the complete books in ascending order; never null
        example:
        - 5
        - 17
        - 1342
        items:
          type: integer
        type: array
      count:
        description: Number of complete books in the datalake
        example: 3
        type: integer
    type: object
  api.BookStatusResponse:
    properties:
      book_id:
        example: 1342
        type: integer
      status:
        enum:
        - available
        example: available
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        example: invalid_parameter
        type: string
      message:
        example: query parameter "limit" must be an integer between 1 and 100
        type: string
    type: object
  api.IngestionResponse:
    properties:
      book_id:
        example: 1342
        type: integer
      path:
        description: Folder of the book in the datalake, always written with forward
          slashes
        example: datalake/batch_1000_1999/1342
        type: string
      status:
        description: 'downloaded: this call wrote the files; available: the datalake
          already held them'
        enum:
        - downloaded
        - available
        example: downloaded
        type: string
    type: object
info:
  contact: {}
  description: |-
    Internal API of the Boogle Engine Ingestion Service. Provider: Ingestion Service.
    Intended consumer: the Control Module, which orchestrates ingestion, indexing and publication.
    It is not part of the front-end contract.
  title: Boogle Engine Ingestion API
  version: 1.0.0
paths:
  /ingest/{book_id}:
    post:
      description: |-
        - **Provider:** Ingestion Service
        - **Intended consumer:** Control Module (internal API, not exposed to the front-end)
        - **Position in the workflow:** first step of a book's lifecycle; index a book only after this call returns 200

        Downloads book `book_id` from Project Gutenberg, splits it into header and body and stores both files in the
        datalake folder returned in `path`. The request has no body.

        **Completion semantics.** Synchronous: a 200 response means the work has fully completed. Each file is written
        atomically (temporary file, flush to disk, rename), so the book is complete and immediately eligible for indexing,
        and no reader ever sees a partial book. `status` is `downloaded` when this call wrote the files and `available`
        when the datalake already held them; both mean success.

        **Idempotency.** Safe to repeat; it never duplicates work or data. A duplicate call returns `available` with the
        same `path` without downloading again, and concurrent calls for the same book share one single download and all
        receive its result. This coordination lives inside one service process: two replicas may download the same book
        at once, and the atomic rename still leaves exactly one complete copy.

        **Timeouts and retries expected of the caller.**
        - The service retries transient download errors by itself within an ingestion budget (`-ingest-timeout`, 2 minutes
        by default) that also covers waiting for a free download slot. Use a client timeout above it, for example 150 s.
        - `503 download_failed` and `500 internal_error`: retry the same request later with exponential backoff.
        - `404 book_unavailable`: permanent. Do not retry; record the book as unavailable.
        - Client timeout or lost connection: retry the same request. The ingestion keeps running in the service, so the
        retry joins it or finds the book `available`.
      parameters:
      - description: Project Gutenberg book ID (positive integer)
        example: 1342
        in: path
        minimum: 1
        name: book_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: The book is complete in the datalake
          schema:
            $ref: '#/definitions/api.IngestionResponse'
        "400":
          description: 'invalid_book_id: book_id is not a positive integer'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: 'book_unavailable: Gutenberg has no such book or its text lacks
            the START/END markers'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: 'internal_error: the datalake could not be written'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: 'download_failed: Gutenberg failed transiently or the ingestion
            budget ran out'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Ingest a book into the datalake
      tags:
      - ingestion
      x-audience: internal
      x-completion: synchronous
      x-consumers:
      - Control Module
      x-idempotent: true
      x-provider: Ingestion Service
  /ingest/list:
    get:
      description: |-
        - **Provider:** Ingestion Service
        - **Intended consumer:** Control Module (internal API), to pick books not processed yet and to rebuild its work
        queue after a restart

        Returns the IDs of the books whose header and body are both complete, in ascending order, and their count. Books
        still being ingested are not listed until their POST /ingest/{book_id} has completed. The list is a snapshot taken
        while scanning the datalake folders and is not paginated.

        **Idempotency, timeouts and retries.** Read-only and safe to repeat. The scan grows with the number of stored books,
        so allow a generous client timeout (about 30 s) and retry `500 internal_error` with exponential backoff.
      produces:
      - application/json
      responses:
        "200":
          description: Complete books in ascending order
          schema:
            $ref: '#/definitions/api.BookListResponse'
        "500":
          description: 'internal_error: the datalake folders could not be read'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List the books in the datalake
      tags:
      - ingestion
      x-audience: internal
      x-completion: synchronous
      x-consumers:
      - Control Module
      x-idempotent: true
      x-provider: Ingestion Service
  /ingest/status/{book_id}:
    get:
      description: |-
        - **Provider:** Ingestion Service
        - **Intended consumer:** Control Module (internal API), as the readiness check before a book is indexed

        Answers 200 `available` only when both the header and the body of the book are completely written. Because files
        are written atomically, a book whose ingestion is still running answers 404 until its POST /ingest/{book_id}
        has completed.

        **Idempotency, timeouts and retries.** Read-only and safe to poll or repeat at any time. It only checks two files
        on disk, so a short client timeout (about 5 s) is enough; retry on timeouts and connection errors.
      parameters:
      - description: Project Gutenberg book ID (positive integer)
        example: 1342
        in: path
        minimum: 1
        name: book_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Both files of the book are in the datalake
          schema:
            $ref: '#/definitions/api.BookStatusResponse'
        "400":
          description: 'invalid_book_id: book_id is not a positive integer'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: 'book_not_found: the datalake holds no complete copy of the
            book'
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Check whether a book is in the datalake
      tags:
      - ingestion
      x-audience: internal
      x-completion: synchronous
      x-consumers:
      - Control Module
      x-idempotent: true
      x-provider: Ingestion Service
schemes:
- http
swagger: "2.0"
tags:
- description: 'Internal API. Provider: Ingestion Service. Consumer: Control Module.'
  name: ingestion
