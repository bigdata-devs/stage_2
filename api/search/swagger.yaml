basePath: /
definitions:
  api.BookResult:
    properties:
      author:
        example: Jane Austen
        type: string
      book_id:
        example: 1342
        type: integer
      language:
        description: ISO 639 code; books written in several languages list them comma-separated
          ("en,fr")
        example: en
        type: string
      title:
        example: Pride and Prejudice
        type: string
      year:
        description: Original publication year, or 0 when unknown
        example: 1813
        type: integer
    type: object
  api.ErrorResponse:
    properties:
      error:
        enum:
        - missing_parameter
        - invalid_parameter
        - internal_error
        example: invalid_parameter
        type: string
      message:
        example: query parameter "limit" must be an integer between 1 and 100
        type: string
    type: object
  api.SearchFilters:
    properties:
      author:
        example: Jane Austen
        type: string
      language:
        example: en
        type: string
      year:
        example: 1813
        type: integer
    type: object
  api.SearchResponse:
    properties:
      filters:
        allOf:
        - $ref: '#/definitions/api.SearchFilters'
        description: Filters that were applied; absent filters are omitted
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      query:
        description: Keyword that was searched, without surrounding spaces
        example: adventure
        type: string
      results:
        description: Books of the requested page; never null
        items:
          $ref: '#/definitions/api.BookResult'
        type: array
      total:
        description: Number of matches across all pages
        example: 25
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Front-end-facing API of the Boogle Engine Search Service: keyword search over
    Project Gutenberg books with optional author, language and publication-year filters.
  title: Boogle Engine Search API
  version: 1.0.0
paths:
  /search:
    get:
      description: |-
        Returns one page of the books that contain the keyword `q`, optionally narrowed by author,
        language and original publication year. Filters can be combined and are joined with AND.
        Empty filter values (for example `author=`) are treated as absent.
        Only the filters that were applied are echoed in `filters`; the object is `{}` when none were sent.
        Results are ordered by relevance, most relevant first, with ties broken by ascending `book_id`.
        `total` counts every match, while `results` holds at most `limit` books starting at `offset`.
        A valid query without matches, or an `offset` past the last match, returns 200 with `results: []`.
      parameters:
      - description: Keyword to search for; surrounding spaces are ignored
        example: adventure
        in: query
        minLength: 1
        name: q
        required: true
        type: string
      - description: Case-insensitive partial match on the author name
        example: Austen
        in: query
        name: author
        type: string
      - description: ISO 639 language code, case-insensitive exact match (en, es,
          fr...)
        example: en
        in: query
        name: language
        type: string
      - description: Exact original publication year
        example: 1813
        in: query
        maximum: 9999
        minimum: 1
        name: year
        type: integer
      - default: 0
        description: Number of matches to skip before the first result
        in: query
        minimum: 0
        name: offset
        type: integer
      - default: 20
        description: Maximum number of results in the page
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: One page of matching books
          schema:
            $ref: '#/definitions/api.SearchResponse'
        "400":
          description: q is missing (missing_parameter) or a parameter is malformed
            (invalid_parameter)
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: The search engine failed (internal_error)
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Search books by keyword
      tags:
      - search
schemes:
- http
swagger: "2.0"
tags:
- description: Keyword search with metadata filters and pagination
  name: search
