# Replica override for testing horizontal scaling of the Search Service.
# Usage: docker compose -f docker-compose.yml -f docker-compose.replicas.yml up -d
#
# This override scales search to 2 replicas and adds an nginx load balancer
# on port 7003 (the original search port). The services connect to nginx
# instead of directly to search.

services:
  search:
    deploy:
      replicas: 2
    ports: !reset []  # Remove direct port mapping; nginx will handle it

  nginx:
    image: nginx:alpine
    ports:
      - "${SEARCH_PORT:-7003}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - search
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
